ServerRoot "/usr/local/apache2"
Listen 8080
ServerName genzo-webdav
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule dav_module modules/mod_dav.so
LoadModule dav_fs_module modules/mod_dav_fs.so
LoadModule alias_module modules/mod_alias.so
LoadModule log_config_module modules/mod_log_config.so
User daemon
Group daemon
ServerTokens Prod
ServerSignature Off
ErrorLog /proc/self/fd/2
LogLevel warn
# Request headers, Authorization and document contents are never logged.
LogFormat "%h %t %m %U %>s" sync
CustomLog /proc/self/fd/1 sync
DavLockDB /var/genzo/locks/DavLock
DocumentRoot /var/genzo/empty
<Directory />
    AllowOverride None
    Require all denied
</Directory>
Alias /genzo/ /var/genzo/library/
<Directory /var/genzo/library>
    Dav On
    Options None
    AllowOverride None
    AuthType Basic
    AuthName "Genzo personal sync"
    AuthUserFile /usr/local/apache2/conf/genzo.htpasswd
    Require valid-user
    FileETag INode MTime Size
    LimitRequestBody 16777216
</Directory>
