[package]
name = "genzo"
version = "0.4.2"
description = "Genzo - 你的私人次元媒体库"
authors = ["Genzo contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "genzo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
tokio = { version = "1", features = ["fs", "macros", "sync", "rt-multi-thread", "net", "io-util", "time"] }
quick-xml = { version = "0.42", features = ["serialize"] }
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
walkdir = "2"
natord = "1"
dunce = "1"
thiserror = "2"
regex = "1"
strsim = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
reqwest13 = { package = "reqwest", version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
anitomy-ng = "1.0.10"
async-trait = "0.1"
lru = "0.12"
tmdb-rs = "1.0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
