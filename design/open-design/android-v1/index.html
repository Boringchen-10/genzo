<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Genzo Android 首版 · 移动端原型</title>
  <style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */
  </style>
  <style>
    /* ===== OD Next handheld shell — Android. Presentation chrome only. ===== */
    :root {
      --phone-screen-width: 412px;
      --phone-screen-height: 915px;
      --phone-bezel: 10px;
      --phone-outer-radius: 46px;
      --phone-screen-radius: 38px;
      --phone-safe-top: 52px;
      --phone-safe-bottom: 28px;
      --phone-system-fg: #17181a;
      --phone-screen-bg: #f6f7f9;
      --phone-stage-bg: #e8eaee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.95), transparent 36%),
        var(--phone-stage-bg);
      color: #191a1d;
      font-family: Roboto, "Noto Sans", system-ui, sans-serif;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 18%),
        linear-gradient(155deg, #414348 0%, #23252a 44%, #0c0d10 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.84),
        0 34px 72px -22px rgba(8,10,14,.56),
        0 11px 25px -10px rgba(8,10,14,.34);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 92px;
      bottom: 92px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.14) 18%, transparent 32%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      right: -3px;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2d3036 62%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.1);
    }
    .hardware-button.volume { top: 205px; height: 92px; }
    .hardware-button.power { top: 322px; height: 70px; background: linear-gradient(90deg, #08090b, #3c424c 62%, #08090b); }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .punch-hole {
      position: absolute;
      z-index: 20;
      top: 14px;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #283343 0 10%, #090b0f 30%, #000 72%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), inset 0 0 3px #000;
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      inset: 0 0 auto;
      height: var(--phone-safe-top);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr);
      align-items: start;
      padding: 14px 19px 0;
      color: var(--phone-system-fg);
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 64px; }
    .status-icons { justify-self: end; display: inline-flex; align-items: center; height: 16px; gap: 5px; }
    .status-icons svg { display: block; flex: none; fill: currentColor; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .cellular { width: 14px; height: 12px; }
    .status-icons .battery { width: 9px; height: 14px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 108px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg);
      opacity: .86;
      pointer-events: none;
    }

    @media (max-height: 998px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 904px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 829px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 754px) { .phone-frame { zoom: 0.66; } }
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }
  </style>
  <style>
    /* ===== Genzo Android app CSS (product surface) ===== */
    :root {
      --bg:#090d0f;
      --bg-raised:#0f1518;
      --surface:rgba(17,24,27,.72);
      --surface-strong:rgba(18,25,29,.92);
      --surface-soft:rgba(var(--tint),.055);
      --tint:255,255,255;
      --shade:9,13,15;
      --line:rgba(var(--tint),.105);
      --line-strong:rgba(var(--tint),.18);
      --text:#f4f7f6;
      --muted:#a8b0af;
      --quiet:#77817f;
      --accent:#75d2ad;
      --accent-ink:#07120e;
      --danger:#ff8e8e;
      --warn:#e9c46a;
      --radius:8px;
      --radius-sm:4px;
      --sheet-radius:16px;
      --blur:24px;
      --shadow:0 20px 60px rgba(0,0,0,.34);
      --ease:220ms cubic-bezier(.2,.8,.2,1);
      --pad:16px;
      --topbar-h:56px;
      --tabbar-h:56px;
      --tap:44px;
      --font-display:"Roboto Condensed","Bahnschrift SemiCondensed","Noto Sans SC",system-ui,sans-serif;
      --font-body:"Roboto","Segoe UI Variable Text","Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif;
    }
    [data-theme="light"] {
      --bg:#f3f6f5;
      --bg-raised:#e7edeb;
      --surface:rgba(255,255,255,.78);
      --surface-strong:rgba(255,255,255,.94);
      --tint:8,20,18;
      --shade:243,246,245;
      --line:rgba(8,20,18,.14);
      --line-strong:rgba(8,20,18,.26);
      --text:#16201e;
      --muted:#53625e;
      --quiet:#71807b;
      --accent:#197a5b;
      --warn:#9a7508;
      --danger:#b64242;
      --shadow:0 18px 44px rgba(20,40,35,.16);
    }

    body { background: radial-gradient(circle at 50% 12%, #141a1d, #05070a 62%); }
    [data-theme="light"] body { background: radial-gradient(circle at 50% 12%, #ffffff, #dbe3e1 62%); }

    .phone-screen .phone-content {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .app { height: 100%; }
    .gz-screen { display: none; height: 100%; }
    .gz-screen.active { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .gz-body { overflow-y: auto; overscroll-behavior: contain; min-height: 0; scrollbar-width: none;
      padding: 4px var(--pad) calc(var(--phone-safe-bottom) + var(--tabbar-h) + 14px); }
    .gz-body::-webkit-scrollbar { display: none; }

    /* ---------- typography ---------- */
    .gz-display { font-family: var(--font-display); font-weight: 700; letter-spacing: 0; }
    .gz-h1 { margin: 2px 0 6px; font-family: var(--font-display); font-size: clamp(30px,8.5vw,52px); line-height: 1.04; font-weight: 700; }
    .gz-h2 { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 700; }
    .gz-eyebrow { color: var(--accent); font: 700 12px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; }
    .gz-meta { color: var(--muted); font-size: 13px; }
    .gz-quiet { color: var(--quiet); font-size: 12px; }
    .gz-num { font-variant-numeric: tabular-nums; }
    .gz-section { margin: 20px 0 0; }
    .gz-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .gz-section-head .gz-link { color: var(--accent); font-size: 13px; font-weight: 600; }

    /* ---------- top bar ---------- */
    .gz-topbar { position: relative; z-index: 12; display: flex; align-items: center; gap: 6px; min-height: var(--topbar-h);
      padding: 8px var(--pad); background: rgba(var(--shade),.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .gz-topbar .gz-title { font-size: 18px; font-weight: 700; }
    .gz-topbar .od-spacer { width: 44px; height: 44px; }
    .gz-iconbtn { flex: none; width: var(--tap); height: var(--tap); display: grid; place-items: center; border: 0; border-radius: var(--radius);
      background: transparent; color: var(--text); cursor: pointer; transition: background var(--ease), color var(--ease); }
    .gz-iconbtn:hover { background: var(--surface-soft); }
    .gz-iconbtn[aria-pressed="true"] { color: var(--accent); }
    .gz-ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .gz-ic.sm svg { width: 18px; height: 18px; }

    /* ---------- buttons / chips / inputs ---------- */
    .gz-btn { min-height: var(--tap); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px;
      border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--text);
      font: inherit; font-weight: 650; cursor: pointer; transition: transform var(--ease), background var(--ease), border-color var(--ease); }
    .gz-btn:active { transform: scale(.98); }
    .gz-btn.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .gz-btn.ghost { background: transparent; border-color: var(--line); }
    .gz-btn.danger { border-color: color-mix(in srgb, var(--danger) 55%, transparent); color: var(--danger); background: transparent; }
    .gz-btn.block { width: 100%; }
    .gz-btn[disabled], .gz-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
    .gz-chip { min-height: 34px; display: inline-flex; align-items: center; gap: 6px; padding: 0 13px; border: 1px solid var(--line);
      border-radius: 999px; background: rgba(var(--tint),.03); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .gz-chip.active { background: rgba(117,210,173,.12); border-color: rgba(117,210,173,.36); color: var(--accent); }
    .gz-input { width: 100%; height: 44px; padding: 0 12px 0 40px; border: 1px solid var(--line); border-radius: var(--radius);
      background: rgba(var(--shade),.5); color: var(--text); font: inherit; }
    .gz-input::placeholder { color: var(--quiet); }
    .gz-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .gz-search { position: relative; display: flex; align-items: center; }
    .gz-search .gz-ic { position: absolute; left: 12px; color: var(--quiet); pointer-events: none; }
    .gz-seg { display: grid; grid-auto-flow: column; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(var(--tint),.03); }
    .gz-seg button { min-height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .gz-seg button.active, .gz-seg button[aria-checked="true"] { background: rgba(var(--tint),.09); color: var(--text); }

    /* ---------- poster & cards ---------- */
    .gz-poster { display: block; position: relative; overflow: hidden; aspect-ratio: 2/3; border-radius: var(--radius); border: 1px solid var(--line);
      background-color: #111a1d; background-image: url("../assets/reference-primary.png"); background-size: auto 168%; background-repeat: no-repeat;
      box-shadow: inset 0 1px rgba(var(--tint),.08); }
    .gz-poster.p1 { background-position: 12% 20%; }
    .gz-poster.p2 { background-position: 46% 30%; }
    .gz-poster.p3 { background-position: 78% 18%; }
    .gz-poster.p4 { background-position: 24% 62%; }
    .gz-poster.p5 { background-position: 62% 70%; }
    .gz-poster.p6 { background-position: 88% 52%; }
    .gz-poster.missing { background-image: none; background-color: rgba(var(--tint),.025); border: 1px dashed var(--line-strong); display: grid; place-items: center; }
    .gz-poster-miss { color: var(--quiet); font-size: 12px; }
    .gz-poster-tag { position: absolute; left: 7px; bottom: 7px; z-index: 1; padding: 3px 6px; border-radius: var(--radius-sm);
      background: rgba(9,13,15,.74); border: 1px solid var(--line); color: #dfe5e3; font-size: 10.5px; backdrop-filter: blur(8px); }
    .gz-poster-fav { position: absolute; right: 6px; top: 6px; z-index: 1; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%;
      background: rgba(9,13,15,.6); color: var(--accent); backdrop-filter: blur(8px); }
    .gz-poster-fav svg { width: 14px; height: 14px; fill: currentColor; stroke: none; }
    .gz-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .gz-card { display: grid; gap: 7px; padding: 0; border: 0; background: transparent; color: var(--text); text-align: left; cursor: pointer; font: inherit; }
    .gz-card:active .gz-poster { transform: scale(.98); }
    .gz-card .gz-poster { transition: transform var(--ease); }
    .gz-card-title { font-size: 13px; font-weight: 600; line-height: 1.35; }
    .gz-card-meta { color: var(--quiet); font-size: 11px; }
    @media (hover: hover) { .gz-card:hover .gz-poster { transform: translateY(-3px); border-color: var(--line-strong); } }

    .gz-hero { position: relative; overflow: hidden; margin: 6px 0 0; border-radius: var(--radius); border: 1px solid var(--line); min-height: 260px;
      background-color: #111a1d; background-image: linear-gradient(180deg, rgba(5,8,9,.05) 0%, rgba(5,8,9,.55) 58%, rgba(5,8,9,.92) 100%), url("../assets/reference-primary.png");
      background-size: cover; background-position: 50% 22%; }
    .gz-hero-inner { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 16px; display: grid; gap: 8px; }
    .gz-hero .gz-h1 { color: #f4f7f6; }
    .gz-hero-meta { display: flex; align-items: center; gap: 8px; color: #cdd4d2; font-size: 12px; }
    .gz-hero-meta .dot::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; }
    .gz-hero-actions { display: flex; gap: 10px; margin-top: 4px; }

    .gz-continue { display: grid; grid-template-columns: 132px minmax(0,1fr); gap: 12px; align-items: center; width: 232px; padding: 8px;
      border: 1px solid var(--line); border-radius: var(--radius); background: rgba(var(--tint),.035); color: var(--text); text-align: left; cursor: pointer; font: inherit; }
    .gz-continue-thumb { position: relative; overflow: hidden; aspect-ratio: 16/9; border-radius: calc(var(--radius) - 2px); border: 1px solid var(--line);
      background-image: url("../assets/reference-secondary.png"); background-size: 230% auto; background-position: 50% 30%; }
    .gz-continue-thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5,8,9,.6), transparent 60%); }
    .gz-continue-play { position: absolute; z-index: 2; left: 8px; bottom: 12px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
      background: rgba(9,13,15,.7); color: var(--accent); border: 1px solid var(--line-strong); }
    .gz-continue-play svg { width: 13px; height: 13px; fill: currentColor; stroke: none; }
    .gz-continue-prog { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(var(--tint),.18); }
    .gz-continue-prog span { display: block; height: 100%; background: var(--accent); }
    .gz-continue-body { display: grid; gap: 4px; }
    .gz-continue-title { font-size: 14px; font-weight: 650; }
    .gz-continue-meta { color: var(--quiet); font-size: 11.5px; }

    /* ---------- list rows ---------- */
    .gz-row-card { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 12px;
      border: 1px solid var(--line); border-radius: var(--radius); background: rgba(var(--tint),.035); }
    .gz-row-card + .gz-row-card { margin-top: 10px; }
    .gz-row-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 10px; background: rgba(var(--tint),.05); color: var(--accent); }
    .gz-row-main { display: grid; gap: 3px; }
    .gz-row-title { font-size: 14px; font-weight: 650; }
    .gz-row-sub { color: var(--quiet); font-size: 11.5px; }
    .gz-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
    .gz-badge.ok { color: var(--accent); border-color: rgba(117,210,173,.34); background: rgba(117,210,173,.1); }
    .gz-badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
    .gz-badge.err { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: color-mix(in srgb, var(--danger) 10%, transparent); }
    .gz-badge.future { color: var(--quiet); border-style: dashed; }

    /* ---------- panels ---------- */
    .gz-panel { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(var(--tint),.035); }
    .gz-panel + .gz-panel { margin-top: 12px; }
    .gz-scan-meter { height: 6px; border-radius: 999px; background: rgba(var(--tint),.14); overflow: hidden; }
    .gz-scan-meter span { display: block; height: 100%; width: var(--v,0%); background: var(--accent); transition: width var(--ease); }
    .gz-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin: 12px 0 4px; }
    .gz-stat { display: grid; gap: 1px; }
    .gz-stat b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .gz-stat span { color: var(--quiet); font-size: 11px; }
    .gz-errors { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .gz-errors li { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 8px; align-items: start; color: var(--muted); font-size: 12.5px; }

    /* ---------- empty / state ---------- */
    .gz-empty { display: grid; place-items: center; gap: 10px; text-align: center; padding: 40px 24px; color: var(--muted); }
    .gz-empty .gz-ic { color: var(--quiet); }
    .gz-empty .gz-ic svg { width: 40px; height: 40px; stroke-width: 1.4; }
    .gz-empty h3 { margin: 0; font-size: 16px; color: var(--text); }
    .gz-empty p { margin: 0; max-width: 34ch; font-size: 13px; line-height: 1.6; }
    .gz-note { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius); font-size: 12.5px; line-height: 1.55; border: 1px solid var(--line); color: var(--muted); background: rgba(var(--tint),.03); }
    .gz-note.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
    .gz-note.err { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }

    /* ---------- detail ---------- */
    .gz-detail-hero { display: grid; grid-template-columns: 116px minmax(0,1fr); gap: 14px; align-items: end; padding-bottom: 6px; }
    .gz-detail-cover { aspect-ratio: 2/3; border-radius: var(--radius); border: 1px solid var(--line-strong); background-color: #111a1d;
      background-image: url("../assets/reference-primary.png"); background-size: auto 170%; background-position: 12% 20%; box-shadow: var(--shadow); }
    .gz-detail-cover.missing { background-image: none; display: grid; place-items: center; border-style: dashed; color: var(--quiet); font-size: 12px; }
    .gz-detail-title { margin: 0 0 4px; font-family: var(--font-display); font-size: 24px; line-height: 1.12; font-weight: 700; }
    .gz-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .gz-tag { padding: 3px 9px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: rgba(var(--tint,.04)); color: var(--muted); font-size: 11.5px; }
    .gz-rating { display: inline-flex; align-items: baseline; gap: 4px; }
    .gz-rating b { color: var(--accent); font-family: var(--font-display); font-size: 22px; }
    .gz-rating span { color: var(--quiet); font-size: 11px; }
    .gz-progress-line { height: 4px; border-radius: 999px; background: rgba(var(--tint),.16); overflow: hidden; }
    .gz-progress-line span { display: block; height: 100%; width: var(--v,0%); background: var(--accent); }
    .gz-dl { margin: 0; display: grid; gap: 10px; }
    .gz-dl > div { display: grid; grid-template-columns: 88px minmax(0,1fr); gap: 10px; align-items: baseline; }
    .gz-dl dt { color: var(--quiet); font-size: 12px; }
    .gz-dl dd { margin: 0; font-size: 13.5px; }
    .gz-credits { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .gz-credits::-webkit-scrollbar { display: none; }
    .gz-credit { flex: none; width: 84px; display: grid; gap: 6px; text-align: center; }
    .gz-credit img { width: 84px; height: 114px; border-radius: var(--radius-sm); border: 1px solid var(--line); object-fit: cover; }
    .gz-credit b { font-size: 12px; font-weight: 600; }
    .gz-credit span { color: var(--quiet); font-size: 10.5px; }
    .gz-epgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .gz-ep { display: grid; gap: 7px; padding: 7px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(var(--tint),.03); color: var(--text); text-align: left; cursor: pointer; font: inherit; }
    .gz-ep[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
    .gz-ep-thumb { position: relative; overflow: hidden; aspect-ratio: 16/9; border-radius: calc(var(--radius) - 2px); border: 1px solid var(--line);
      background-image: url("../assets/reference-secondary.png"); background-size: 230% auto; background-position: 30% 30%; }
    .gz-ep-thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(5,8,9,.5), transparent 62%); }
    .gz-ep-num { position: absolute; z-index: 2; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: var(--radius-sm); background: rgba(9,13,15,.72); color: #dfe5e3; font-size: 10.5px; }
    .gz-ep-title { font-size: 12.5px; font-weight: 600; }
    .gz-ep-meta { display: flex; align-items: center; gap: 6px; color: var(--quiet); font-size: 10.5px; }

    /* ---------- detail ambient backdrop ---------- */
    .gz-screen[data-route="detail"] { position: relative; }
    .gz-screen[data-route="detail"] .gz-topbar { background: transparent; backdrop-filter: none; border-bottom-color: transparent; }
    .gz-screen[data-route="detail"] .gz-body { position: relative; z-index: 1; }
    .gz-detail-ambient { position: absolute; z-index: 0; left: 0; right: 0; top: 0; height: 54%; pointer-events: none; overflow: hidden; }
    .gz-detail-ambient-img { position: absolute; inset: -16% -16% 0 -16%;
      background-image: url("../assets/reference-primary.png"); background-repeat: no-repeat; background-size: auto 330%; background-position: 50% 22%;
      filter: blur(46px) saturate(1.4) brightness(.9); transform: scale(1.06); transform-origin: 50% 28%;
      opacity: 0; transition: opacity 560ms var(--ease), background-position 560ms var(--ease); }
    .gz-screen[data-route="detail"].active .gz-detail-ambient-img { opacity: .92; }
    .gz-detail-ambient::after { content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(var(--shade),.5) 0%, rgba(var(--shade),.22) 26%, transparent 46%),
                  linear-gradient(180deg, transparent 0%, transparent 40%, var(--bg) 100%); }
    [data-theme="light"] .gz-detail-ambient-img { filter: blur(46px) saturate(1.15) brightness(1.12); }
    [data-theme="light"] .gz-detail-ambient::after { background: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.25) 26%, transparent 46%),
                  linear-gradient(180deg, transparent 0%, transparent 40%, var(--bg) 100%); }
    @keyframes gz-detail-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .gz-screen[data-route="detail"].active #detailBody { animation: gz-detail-rise 420ms var(--ease) both; }

    /* ---------- forms ---------- */
    .gz-field { display: grid; gap: 6px; margin-bottom: 14px; }
    .gz-field > label { font-size: 13px; font-weight: 600; }
    .gz-field .req { color: var(--danger); }
    .gz-field input, .gz-field select, .gz-field textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
      background: rgba(var(--shade),.5); color: var(--text); font: inherit; }
    .gz-field textarea { min-height: 88px; resize: vertical; }
    .gz-field .hint { color: var(--quiet); font-size: 11.5px; line-height: 1.5; }
    .gz-field .err { color: var(--danger); font-size: 11.5px; }
    .gz-field.invalid input { border-color: var(--danger); }

    /* ---------- tab bar ---------- */
    .gz-tabbar { position: absolute; z-index: 14; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4,1fr); gap: 2px;
      padding: 6px 8px calc(var(--phone-safe-bottom) + 4px); background: rgba(var(--shade),.86); backdrop-filter: blur(var(--blur)); border-top: 1px solid var(--line); }
    .gz-tabbar button { display: grid; justify-items: center; gap: 3px; min-height: 44px; padding: 4px; border: 0; border-radius: 10px; background: transparent; color: var(--quiet); font: inherit; font-size: 10.5px; cursor: pointer; }
    .gz-tabbar button .gz-ic svg { width: 22px; height: 22px; }
    .gz-tabbar button.active { color: var(--accent); background: rgba(117,210,173,.08); }
    .gz-tabbar button.future { color: var(--quiet); opacity: .5; }

    /* ---------- overlay host: dialog / sheet / toast ---------- */
    .gz-overlay-host { position: absolute; inset: 0; z-index: 90; pointer-events: none; }
    .gz-scrim { position: absolute; inset: 0; background: rgba(3,6,8,.72); backdrop-filter: blur(2px); pointer-events: auto; opacity: 0; transition: opacity var(--ease); }
    .gz-scrim.show { opacity: 1; }
    .gz-dialog { position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-46%) scale(.98); max-width: 460px; margin-inline: auto; max-height: 82%; overflow-y: auto; scrollbar-width: none;
      padding: 18px; border: 1px solid var(--line-strong); border-radius: var(--sheet-radius); background: var(--surface-strong); box-shadow: var(--shadow); pointer-events: auto; opacity: 0; transition: opacity var(--ease), transform var(--ease); }
    .gz-dialog::-webkit-scrollbar { display: none; }
    .gz-dialog.show { opacity: 1; transform: translateY(-50%) scale(1); }
    .gz-sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 520px; margin-inline: auto; max-height: 78%; display: grid; grid-template-rows: auto minmax(0,1fr);
      border-radius: var(--sheet-radius) var(--sheet-radius) 0 0; background: var(--surface-strong); border-top: 1px solid var(--line-strong);
      box-shadow: var(--shadow); transform: translateY(102%); transition: transform 260ms ease-out; pointer-events: auto; }
    .gz-sheet.show { transform: translateY(0); }
    .gz-sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .gz-sheet-head h2 { margin: 0; font-size: 16px; }
    .gz-sheet-body { overflow-y: auto; scrollbar-width: none; padding: 12px 16px calc(var(--phone-safe-bottom) + 16px); }
    .gz-sheet-body::-webkit-scrollbar { display: none; }
    .gz-option { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; padding: 10px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
    .gz-option:last-child { border-bottom: 0; }
    .gz-option .gz-check { color: var(--accent); opacity: 0; }
    .gz-option[aria-selected="true"] .gz-check { opacity: 1; }
    .gz-option .gz-option-sub { display: block; color: var(--quiet); font-size: 11.5px; }
    .gz-toast { position: absolute; left: 16px; right: 16px; bottom: calc(var(--phone-safe-bottom) + var(--tabbar-h) + 16px); max-width: 520px; margin-inline: auto; padding: 12px 14px; border: 1px solid var(--line-strong);
      border-radius: var(--radius); background: var(--surface-strong); color: var(--text); font-size: 13px; box-shadow: var(--shadow); pointer-events: auto;
      transform: translateY(12px); opacity: 0; transition: opacity var(--ease), transform var(--ease); }
    .gz-toast.show { opacity: 1; transform: translateY(0); }
    .gz-toast.err { border-color: color-mix(in srgb, var(--danger) 45%, transparent); }

    /* ---------- player overlay ---------- */
    .gz-player { position: fixed; inset: 0; z-index: 120; display: none; place-items: center; background: radial-gradient(circle at 50% 30%, #0b1114, #030507 70%); }
    .gz-player.open { display: grid; }
    .gz-stage { position: relative; width: min(94vw, 412px); height: min(94vh, 915px); border-radius: 20px; overflow: hidden; background: #04070a; color: #f4f7f6;
      border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.62); display: grid; grid-template-rows: auto minmax(0,1fr) auto; font-family: var(--font-body); }
    .gz-player.landscape .gz-stage { width: min(96vw, 1000px); height: min(92vh, 446px); display: block; border-radius: 14px; }
    .gz-ptop { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #070b0e; border-bottom: 1px solid rgba(255,255,255,.06); }
    .gz-ptop .gz-ptitle { min-width: 0; display: grid; gap: 1px; }
    .gz-ptop .gz-ptitle b { font-size: 14px; font-weight: 650; }
    .gz-ptop .gz-ptitle span { color: #9aa3a1; font-size: 11px; }
    .gz-picon { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: #e8edeb; cursor: pointer; }
    .gz-picon:hover { background: rgba(255,255,255,.08); }
    .gz-picon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .gz-pbody { position: relative; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
    .gz-surface { position: relative; overflow: hidden; aspect-ratio: 16/9; background: #000; }
    .gz-surface-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .82; }
    .gz-surface-scrim { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgba(0,0,0,.05), rgba(0,0,0,.66)); }
    .gz-surface-play { position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 64px; height: 64px; display: grid; place-items: center;
      border-radius: 50%; border: 1.5px solid rgba(117,210,173,.7); background: rgba(9,13,15,.55); color: var(--accent); cursor: pointer; backdrop-filter: blur(6px); }
    .gz-surface-play svg { width: 26px; height: 26px; fill: currentColor; stroke: none; }
    .gz-native-tag { position: absolute; z-index: 2; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: var(--radius-sm);
      border: 1px dashed rgba(255,255,255,.34); background: rgba(4,7,10,.6); color: #aab3b1; font-size: 10px; letter-spacing: .04em; }
    .gz-unsupported { position: absolute; z-index: 4; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; background: rgba(4,7,10,.86); }
    .gz-unsupported.on { display: grid; }
    .gz-unsupported .gz-ic { color: var(--warn); }
    .gz-unsupported .gz-ic svg { width: 40px; height: 40px; }
    .gz-pinfo { padding: 14px 16px; display: grid; gap: 12px; align-content: start; }
    .gz-pinfo .gz-pinfo-title { font-size: 15px; font-weight: 650; }
    .gz-railrow { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
    .gz-prail { display: grid; justify-items: center; gap: 5px; min-height: 56px; padding: 8px 4px; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; background: rgba(255,255,255,.035); color: #d7dcdb; font: inherit; font-size: 11px; cursor: pointer; }
    .gz-prail .gz-ic svg { width: 20px; height: 20px; }
    .gz-prail.active { color: var(--accent); border-color: rgba(117,210,173,.4); background: rgba(117,210,173,.1); }
    .gz-pctl { padding: 10px 16px calc(var(--phone-safe-bottom) + 12px); background: #070b0e; border-top: 1px solid rgba(255,255,255,.06); display: grid; gap: 8px; }
    .gz-seek { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 10px; color: #9aa3a1; font-size: 11px; }
    .gz-range { appearance: none; width: 100%; height: 4px; border-radius: 999px; background: rgba(255,255,255,.2); accent-color: var(--accent); }
    .gz-range::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #04070a; }
    .gz-transport { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; gap: 6px; }
    .gz-transport .gz-picon { justify-self: center; }
    .gz-transport .play { width: 56px; height: 56px; border-radius: 50%; background: rgba(117,210,173,.14); color: var(--accent); }
    .gz-transport .play svg { width: 26px; height: 26px; fill: currentColor; stroke: none; }
    .gz-player.landscape .gz-ptop { position: absolute; top: 0; left: 0; right: 0; z-index: 3; background: linear-gradient(180deg, rgba(0,0,0,.72), transparent); border: 0; }
    .gz-player.landscape .gz-pbody { position: absolute; inset: 0; display: block; }
    .gz-player.landscape .gz-surface { height: 100%; aspect-ratio: auto; }
    .gz-player.landscape .gz-pinfo { display: none; }
    .gz-player.landscape .gz-pctl { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: linear-gradient(0deg, rgba(0,0,0,.78), transparent); border: 0; padding-top: 30px; }
    .gz-player.landscape .gz-native-tag { top: auto; bottom: 96px; }
    .gz-player .gz-sheet { position: absolute; z-index: 6; }
    .gz-player .gz-scrim { z-index: 5; }

    /* ---------- misc ---------- */
    .gz-stack-16 { display: grid; gap: 16px; }
    .gz-divider { height: 1px; background: var(--line); margin: 18px 0 0; }
    .gz-kbd { font: inherit; font-size: 12px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--muted); }
    .gz-legend { display: flex; flex-wrap: wrap; gap: 6px; }
    .gz-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .phone-screen :where(button, [href], input, select, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <div class="phone-frame" data-phone-shell data-platform="android">
    <span class="hardware-button volume" aria-hidden="true"></span>
    <span class="hardware-button power" aria-hidden="true"></span>

    <section class="phone-screen" data-phone-screen>
      <main class="phone-content" data-phone-content>
        <!-- APP CONTENT START -->
        <div class="app" id="app">

          <!-- ===== 首页 ===== -->
          <section class="gz-screen active" data-route="home" aria-label="首页">
            <header class="gz-topbar">
              <span class="gz-display" style="font-size:20px;color:var(--accent);letter-spacing:.04em">GENZO</span>
              <span class="od-spacer"></span>
              <button class="gz-iconbtn gz-ic" id="homeSearchBtn" aria-label="搜索媒体库" data-tab="library"></button>
              <button class="gz-iconbtn gz-ic" aria-label="设置" data-nav="profile"></button>
            </header>
            <div class="gz-body" id="homeBody"></div>
          </section>

          <!-- ===== 媒体库 ===== -->
          <section class="gz-screen" data-route="library" aria-label="媒体库">
            <header class="gz-topbar">
              <span class="gz-title">媒体库</span>
              <span class="od-spacer"></span>
              <button class="gz-iconbtn gz-ic" aria-label="来源管理" data-nav="sources"></button>
              <button class="gz-iconbtn gz-ic" aria-label="待整理" data-nav="inbox"></button>
            </header>
            <div class="gz-body" id="libraryBody"></div>
          </section>

          <!-- ===== 收藏 ===== -->
          <section class="gz-screen" data-route="favorites" aria-label="收藏">
            <header class="gz-topbar"><span class="gz-title">收藏</span></header>
            <div class="gz-body" id="favoritesBody"></div>
          </section>

          <!-- ===== 我的 / 设置 ===== -->
          <section class="gz-screen" data-route="profile" aria-label="我的">
            <header class="gz-topbar"><span class="gz-title">我的</span></header>
            <div class="gz-body" id="profileBody"></div>
          </section>

          <!-- ===== 来源管理（二级页） ===== -->
          <section class="gz-screen" data-route="sources" aria-label="来源管理">
            <header class="gz-topbar">
              <button class="gz-iconbtn gz-ic" aria-label="返回" data-back></button>
              <span class="gz-title">来源管理</span>
              <span class="od-spacer"></span>
              <button class="gz-iconbtn gz-ic" aria-label="添加来源" data-action="add-source"></button>
            </header>
            <div class="gz-body" id="sourcesBody"></div>
          </section>

          <!-- ===== 待整理（二级页） ===== -->
          <section class="gz-screen" data-route="inbox" aria-label="待整理">
            <header class="gz-topbar">
              <button class="gz-iconbtn gz-ic" aria-label="返回" data-back></button>
              <span class="gz-title">待整理</span>
              <span class="od-spacer"></span>
              <button class="gz-iconbtn gz-ic" aria-label="批量整理" data-action="inbox-help"></button>
            </header>
            <div class="gz-body" id="inboxBody"></div>
          </section>

          <!-- ===== 作品详情（二级页） ===== -->
          <section class="gz-screen" data-route="detail" data-od-id="work-detail-screen" aria-label="作品详情">
            <div class="gz-detail-ambient" aria-hidden="true"><div class="gz-detail-ambient-img" id="detailAmbientImg"></div></div>
            <header class="gz-topbar">
              <button class="gz-iconbtn gz-ic" aria-label="返回" data-back></button>
              <span class="gz-title">作品详情</span>
              <span class="od-spacer"></span>
              <button class="gz-iconbtn gz-ic" aria-label="收藏" id="detailFavBtn" data-action="toggle-fav"></button>
            </header>
            <div class="gz-body" id="detailBody"></div>
          </section>

          <!-- ===== 探索（Future 预留） ===== -->
          <section class="gz-screen" data-route="explore" aria-label="探索">
            <header class="gz-topbar">
              <button class="gz-iconbtn gz-ic" aria-label="返回" data-back></button>
              <span class="gz-title">探索</span>
            </header>
            <div class="gz-body" id="exploreBody"></div>
          </section>

          <!-- ===== 书架（Future 预留） ===== -->
          <section class="gz-screen" data-route="bookshelf" aria-label="书架">
            <header class="gz-topbar">
              <button class="gz-iconbtn gz-ic" aria-label="返回" data-back></button>
              <span class="gz-title">书架</span>
            </header>
            <div class="gz-body" id="bookshelfBody"></div>
          </section>

        </div>
        <!-- APP CONTENT END -->
      </main>

      <nav class="gz-tabbar" id="tabbar" aria-label="主导航"></nav>
      <div class="gz-overlay-host" id="overlayHost"></div>

      <div class="status-bar" aria-hidden="true">
        <span class="status-time">9:41</span>
        <span class="status-cutout-zone"></span>
        <span class="status-icons">

    }
    function renderTabbar() {
      var items = [["home", "首页", "home"], ["library", "媒体库", "library"], ["favorites", "收藏", "heart"], ["profile", "我的", "user"]];
      $("#tabbar").innerHTML = items.map(function (t) {
        return '<button data-route="' + t[0] + '" data-tab="' + t[0] + '" aria-label="' + t[1] + '">' + icon(t[2]) + '<span>' + t[1] + '</span></button>';
      }).join("");
    }

    /* ---------------- global events ---------------- */
    document.addEventListener("click", function (e) {
      var t = e.target;
      var nav = t.closest("[data-nav]"); if (nav) { navigate("/" + nav.getAttribute("data-nav")); return; }
      var tab = t.closest("[data-tab]"); if (tab) { navigate("/" + tab.getAttribute("data-tab")); return; }
      var back = t.closest("[data-back]"); if (back) { goBack(); return; }
      var work = t.closest("[data-work]"); if (work) { navigate("/detail/" + work.getAttribute("data-work")); return; }
      var play = t.closest("[data-play]"); if (play) { openPlayer(play.getAttribute("data-play"), parseInt(play.getAttribute("data-ep"), 10)); return; }
      var filter = t.closest("[data-filter]"); if (filter) { state.libraryFilter = filter.getAttribute("data-filter"); renderLibrary(); return; }
      var ff = t.closest("[data-ff]"); if (ff) { state.favoritesFilter = ff.getAttribute("data-ff"); renderFavorites(); return; }
      var act = t.closest("[data-action]"); if (act) { handleAction(act.getAttribute("data-action"), act); return; }
    });
    var playerRoot = $("#player");
    playerRoot.addEventListener("click", function (e) {
      var b = e.target.closest("[data-pctl]"); if (!b) return;
      var p = b.getAttribute("data-pctl");
      if (p === "close") closePlayer();
      else if (p === "toggle") togglePlay();
      else if (p === "prev") switchEp(-1);
      else if (p === "next") switchEp(1);
      else if (p === "back10") step(-10);
      else if (p === "fwd10") step(10);
      else if (p === "rotate") { player.landscape = !player.landscape; playerRoot.classList.toggle("landscape", player.landscape); }
      else if (p === "more") toast("更多：截图 / 音画同步 / 投屏（示例）");
      else if (p === "external") toast("已请求用外部工具打开（示例）");
      else if (SHEET_BUILDERS[p]) SHEET_BUILDERS[p]();
    });
    var seek = $("#pSeek");
    if (seek) seek.addEventListener("input", function () { player.pct = parseInt(seek.value, 10) / 1000; updatePlayerUI(); });
    window.addEventListener("hashchange", renderRoute);
    window.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { if (overlay) clearOverlay(); else if (playerRoot.classList.contains("open")) closePlayer(); }
      else if ((e.key === " " || e.code === "Space") && playerRoot.classList.contains("open") && !/INPUT|TEXTAREA/.test((e.target.tagName || ""))) { e.preventDefault(); togglePlay(); }
      else if (e.key === "ArrowRight" && playerRoot.classList.contains("open")) step(10);
      else if (e.key === "ArrowLeft" && playerRoot.classList.contains("open")) step(-10);
    });
    // Android 系统返回：映射到历史后退 / 关闭覆盖层（接入时由原生 onBackPressed 转发同一处理）。
    window.goBack = goBack;

    /* ---------------- boot ---------------- */
    renderTabbar();
    var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    state.theme = "system";
    root.setAttribute("data-theme", prefersLight ? "light" : "dark");
    renderRoute();
  })();
  </script>
</body>
</html>
